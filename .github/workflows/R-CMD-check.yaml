name: R package check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install test dependency
        shell: Rscript {0}
        run: |
          install.packages("testthat")

      - name: Build package
        shell: bash
        run: R CMD build R-package/ImmuCellAI2.0

      - name: Check package
        shell: bash
        run: R CMD check --no-manual --as-cran ImmuCellAI2.0_*.tar.gz
