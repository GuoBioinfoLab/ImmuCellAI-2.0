name: Release R source package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish R package
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' R-package/ImmuCellAI2.0/DESCRIPTION | tr -d '\r')"

          if [[ -z "$package_version" ]]; then
            echo "Could not read Version from DESCRIPTION." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match DESCRIPTION version $package_version." >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Build R source package
        shell: bash
        run: |
          set -euo pipefail
          R CMD build R-package/ImmuCellAI2.0
          package_file="ImmuCellAI2.0_${PACKAGE_VERSION}.tar.gz"
          test -s "$package_file"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Verify installable archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-test-library
          R CMD INSTALL --library=release-test-library "$PACKAGE_FILE"
          Rscript -e ".libPaths('release-test-library'); library(ImmuCellAI2.0); stopifnot(as.character(packageVersion('ImmuCellAI2.0')) == Sys.getenv('PACKAGE_VERSION'))"

      - name: Create GitHub Release and upload only the R package asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE_FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE_FILE" \
              --verify-tag \
              --title "ImmuCellAI 2.0 v${PACKAGE_VERSION}" \
              --generate-notes
          fi
